  [profiles.life_game]

    [[profiles.life_game.layers]]
      step_interval = 0.25
      density = 0.3
      type = "life"

  # Not a game -- a layer. Stack it over a dim base to see where you type.
  [profiles.heatmap]

    [[profiles.heatmap.layers]]
      type = "static_color"
