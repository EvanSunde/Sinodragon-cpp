[apps]
  default_profile = "liquid_n"
  default_shortcut = "default"
  [apps.mappings]
    Code = "coding"
    WindSurf = "food"
    kitty = "maze"
    "org.kde.dolphin" = "liquid_n"
    "org.kde.kate" = "deepfocus"
    windsurf = "food"
    [apps.mappings."org.kde.okular"]
      profile = "liquid_ocean"
      shortcut = "okular"
    [apps.mappings.zen]
      profile = "food"
      shortcut = "zen"

[device]
  name = "Redragon"
  vendor_id = 9610
  product_id = 73
  packet_header = [8, 10, 122, 1]
  packet_length = 382
  layout = "example_layout.csv"
  keycodes = "example_keycodes.csv"
  interface_usage_page = 65280
  interface_usage = 1
  transport = "hidapi"
  frame_interval_ms = 100
  config_watch_mode = true

